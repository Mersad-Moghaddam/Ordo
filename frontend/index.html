<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ordo Frontend</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Ordo Task Platform</h1>
      <nav id="top-nav"></nav>
    </header>

    <main id="app"></main>

    <template id="auth-template">
      <section class="grid two-col">
        <article class="card">
          <h2>Sign In</h2>
          <form id="signin-form" class="stack">
            <label>Email <input type="email" name="email" required /></label>
            <label>Password <input type="password" name="password" required /></label>
            <button type="submit">Sign In</button>
          </form>
        </article>
        <article class="card">
          <h2>Sign Up</h2>
          <form id="signup-form" class="stack">
            <label>Email <input type="email" name="email" required /></label>
            <label>Password <input type="password" name="password" required /></label>
            <label>
              Role
              <select name="role">
                <option value="member">Member</option>
                <option value="admin">Admin</option>
              </select>
            </label>
            <button type="submit">Create account</button>
          </form>
        </article>
      </section>
    </template>

    <template id="dashboard-template">
      <section class="grid three-col">
        <article class="card">
          <h2>Token Session</h2>
          <p class="hint">Use refresh token to renew access token.</p>
          <form id="refresh-token-form" class="stack">
            <button type="submit">Refresh access token</button>
          </form>
          <button id="signout" class="secondary">Sign out</button>
        </article>

        <article class="card">
          <h2>Create Workspace</h2>
          <form id="create-workspace-form" class="stack">
            <label>Workspace Key <input name="workspaceKey" required /></label>
            <label>Display Name <input name="displayName" required /></label>
            <label>Owner User ID <input name="ownerUserId" required /></label>
            <button type="submit">Create workspace</button>
          </form>
        </article>

        <article class="card">
          <h2>List User Workspaces</h2>
          <form id="list-workspaces-form" class="stack">
            <label>User ID <input name="userId" required /></label>
            <label>Page <input name="page" type="number" value="1" min="1" /></label>
            <label>Page Size <input name="pageSize" type="number" value="20" min="1" /></label>
            <button type="submit">Load workspaces</button>
          </form>
        </article>
      </section>

      <section class="grid three-col">
        <article class="card">
          <h2>Add Membership</h2>
          <form id="add-membership-form" class="stack">
            <label>Workspace ID <input name="workspaceId" required /></label>
            <label>Actor User ID <input name="actorUserId" required /></label>
            <label>Target User ID <input name="targetUserId" required /></label>
            <label>Invited By User ID <input name="invitedByUserId" required /></label>
            <label>
              Target Role
              <select name="targetRole">
                <option value="viewer">viewer</option>
                <option value="member">member</option>
                <option value="admin">admin</option>
                <option value="owner">owner</option>
              </select>
            </label>
            <button type="submit">Add member</button>
          </form>
        </article>

        <article class="card">
          <h2>Create Project</h2>
          <form id="create-project-form" class="stack">
            <label>Workspace ID <input name="workspaceId" required /></label>
            <label>Actor User ID <input name="actorUserId" required /></label>
            <label>Project Key <input name="projectKey" required /></label>
            <label>Display Name <input name="displayName" required /></label>
            <label>Description <textarea name="description"></textarea></label>
            <button type="submit">Create project</button>
          </form>
        </article>

        <article class="card">
          <h2>List Projects</h2>
          <form id="list-projects-form" class="stack">
            <label>Workspace ID <input name="workspaceId" required /></label>
            <label>Page <input name="page" type="number" value="1" min="1" /></label>
            <label>Page Size <input name="pageSize" type="number" value="20" min="1" /></label>
            <button type="submit">Load projects</button>
          </form>
        </article>
      </section>

      <section class="grid three-col">
        <article class="card">
          <h2>Create Task</h2>
          <form id="create-task-form" class="stack">
            <label>Workspace ID <input name="workspaceId" required /></label>
            <label>Project ID <input name="projectId" required /></label>
            <label>Title <input name="title" required /></label>
            <label>Description <textarea name="description"></textarea></label>
            <label>
              Priority
              <select name="priority">
                <option value="low">low</option>
                <option value="medium">medium</option>
                <option value="high">high</option>
              </select>
            </label>
            <label>Assignee User ID <input name="assigneeUserId" required /></label>
            <label>Created By User ID <input name="createdByUserId" required /></label>
            <button type="submit">Create task</button>
          </form>
        </article>

        <article class="card">
          <h2>Update Task Status</h2>
          <form id="update-task-status-form" class="stack">
            <label>Task ID <input name="taskId" required /></label>
            <label>
              Status
              <select name="status">
                <option value="todo">todo</option>
                <option value="in_progress">in_progress</option>
                <option value="done">done</option>
              </select>
            </label>
            <button type="submit">Update status</button>
          </form>
        </article>

        <article class="card">
          <h2>List Project Tasks</h2>
          <form id="list-tasks-form" class="stack">
            <label>Project ID <input name="projectId" required /></label>
            <label>Page <input name="page" type="number" value="1" min="1" /></label>
            <label>Page Size <input name="pageSize" type="number" value="20" min="1" /></label>
            <button type="submit">Load tasks</button>
          </form>
        </article>
      </section>

      <section class="grid three-col">
        <article class="card">
          <h2>Create Comment</h2>
          <form id="create-comment-form" class="stack">
            <label>Workspace ID <input name="workspaceId" required /></label>
            <label>Project ID <input name="projectId" required /></label>
            <label>Task ID <input name="taskId" required /></label>
            <label>Author User ID <input name="authorUserId" required /></label>
            <label>Body <textarea name="body" required></textarea></label>
            <button type="submit">Create comment</button>
          </form>
        </article>

        <article class="card">
          <h2>Update / Delete Comment</h2>
          <form id="update-comment-form" class="stack">
            <label>Comment ID <input name="commentId" required /></label>
            <label>Actor User ID <input name="actorUserId" required /></label>
            <label>Body <textarea name="body" required></textarea></label>
            <button type="submit">Update comment</button>
          </form>
          <form id="delete-comment-form" class="stack separated">
            <label>Comment ID <input name="commentId" required /></label>
            <label>Actor User ID <input name="actorUserId" required /></label>
            <button type="submit" class="danger">Delete comment</button>
          </form>
        </article>

        <article class="card">
          <h2>Comments / Activity Feed</h2>
          <form id="list-comments-form" class="stack">
            <label>Task ID <input name="taskId" required /></label>
            <label>Page <input name="page" type="number" value="1" min="1" /></label>
            <label>Page Size <input name="pageSize" type="number" value="20" min="1" /></label>
            <button type="submit">List comments</button>
          </form>
          <form id="list-activities-form" class="stack separated">
            <label>Task ID <input name="taskId" required /></label>
            <label>Page <input name="page" type="number" value="1" min="1" /></label>
            <label>Page Size <input name="pageSize" type="number" value="20" min="1" /></label>
            <button type="submit">List activities</button>
          </form>
        </article>
      </section>
    </template>

    <template id="admin-template">
      <section class="card">
        <h2>Admin Panel</h2>
        <p>
          This page is intended for users with the <code>admin</code> role. It aggregates system operations and quick links
          to workspace, project, task, and collaboration actions.
        </p>
        <ul>
          <li>Provision new workspaces and assign memberships.</li>
          <li>Create and audit projects/tasks at scale.</li>
          <li>Review comment and activity feeds for moderation.</li>
        </ul>
      </section>
    </template>

    <section class="card output-wrap">
      <h2>API Response</h2>
      <pre id="output">Ready.</pre>
    </section>

    <script type="module" src="./app.js"></script>
  </body>
</html>
