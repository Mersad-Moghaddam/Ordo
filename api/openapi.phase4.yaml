openapi: 3.0.3
info:
  title: Ordo API
  version: 0.5.0
paths:
  /api/v1/comments:
    post:
      summary: Create comment and append activity + outbox event
      responses:
        '201':
          description: Comment created
  /api/v1/comments/{commentId}:
    patch:
      summary: Update comment and append activity + outbox event
      responses:
        '204':
          description: Comment updated
    delete:
      summary: Soft delete comment and append activity + outbox event
      responses:
        '204':
          description: Comment deleted
  /api/v1/tasks/{taskId}/comments:
    get:
      summary: List task comments
      responses:
        '200':
          description: Comment page result
  /api/v1/tasks/{taskId}/activities:
    get:
      summary: List task activities
      responses:
        '200':
          description: Activity page result
