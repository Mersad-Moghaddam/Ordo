openapi: 3.0.3
info:
  title: Ordo API
  version: 0.2.0
paths:
  /api/v1/auth/register:
    post:
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
                role:
                  type: string
      responses:
        '201':
          description: Authentication tokens
  /api/v1/auth/login:
    post:
      summary: Login user
      responses:
        '200':
          description: Authentication tokens
  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh token and issue a new token pair
      responses:
        '200':
          description: Rotated authentication tokens
