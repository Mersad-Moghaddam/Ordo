version: "2"
sql:
  - engine: "mysql"
    queries: "internal/infrastructure/persistence/mysql/sqlc/query"
    schema: "migrations"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/infrastructure/persistence/mysql/sqlc/gen"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_interface: true
